# Redis 8 configuration for the production compose stack.
# `requirepass` is NOT set here: compose injects it from REDIS_PASSWORD (the include below).
#
# DESIGN CHOICE: one instance, policy `noeviction`.
# Redis holds two kinds of data with opposite needs:
#   * BullMQ queues and the worker heartbeat must NEVER be evicted (losing a job is a bug).
#   * Cache keys may be evicted (allkeys-lru).
# `maxmemory-policy` is per instance, so a mixed instance can only be safe for the queues, i.e.
# `noeviction`. Today the only other keys are rate-limit counters, which expire by TTL within a
# minute, so they cannot fill memory. When a real cache arrives (settings cache, Phase 1+), add a
# second instance `redis-cache` (maxmemory-policy allkeys-lru) rather than changing this one.
# Rule for application code: every key that is not a queue key MUST be written with a TTL.

# --- Authentication (file provided by compose `configs`, see compose.prod.yml) ---
include /run/redis-auth/auth.conf

# --- Network ---
# the container is only on the internal Docker network, no published port
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 60
timeout 0

# --- Memory (container limit is 256 MB, see compose.prod.yml) ---
maxmemory 192mb
maxmemory-policy noeviction

# --- Persistence: AOF every second, so a crash loses at most ~1 s of queue state ---
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000
dir /data

# --- Hardening: commands that wipe data, scan the keyspace or reconfigure the server ---
# An empty name disables the command. Applications never need them.
#   FLUSHALL / FLUSHDB  wipe everything
#   KEYS                O(N) scan that blocks the server (use SCAN)
#   CONFIG              runtime reconfiguration (including re-enabling the above)
#   DEBUG               crash / sleep / reload helpers
# Operators who need them can `docker exec` and run redis-server with a temporary config.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command DEBUG ""

# --- Logging ---
loglevel notice
