# PostgreSQL 18 tuning for the production compose stack.
# Sized for: 4 GB RAM host, `postgres` container limited to 1 GB (see compose.prod.yml).
# Scale-up rule of thumb when you resize the server (give Postgres ~25% of RAM):
#   shared_buffers          = 25% of the container limit
#   effective_cache_size    = 60-75% of the container limit
#   maintenance_work_mem    = 5-10% of the container limit (max 1GB)
#   work_mem                = (container limit - shared_buffers) / (max_connections * 3), rounded down
#   max_connections         = 50 is plenty behind pooled apps; raise only with a pooler (PgBouncer).
# Then raise `mem_limit` on the postgres service by the same factor.

listen_addresses = '*'              # reachable only on the internal Docker network
port = 5432

# --- Connections ---
max_connections = 50
password_encryption = scram-sha-256

# --- Memory ---
shared_buffers = 256MB
effective_cache_size = 640MB
work_mem = 8MB
maintenance_work_mem = 96MB
huge_pages = off                    # not available inside most small VMs

# --- Write-ahead log and checkpoints ---
wal_level = replica
max_wal_size = 1GB
min_wal_size = 160MB
checkpoint_completion_target = 0.9
wal_compression = on

# --- Planner (SSD storage) ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Parallel query: keep small on a 2 vCPU host ---
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1

# --- Safety nets: a runaway query or forgotten transaction must not take the database down ---
statement_timeout = 30s
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s
# Migrations can be slow; the migrate container overrides with `SET statement_timeout = 0` if needed.

# --- Logging (goes to Docker's json-file driver, rotated) ---
logging_collector = off
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
