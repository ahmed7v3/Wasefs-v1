# Local development: Postgres, Redis and MinIO (stands in for Cloudflare R2).
# The apps run on the host with `pnpm dev`.
# Credentials here are for a throwaway local database and must never be reused anywhere else.
name: wasfa-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wasfa
      POSTGRES_PASSWORD: wasfa_dev_password
      POSTGRES_DB: wasfa
    ports:
      # 127.0.0.1 only: the database must never be reachable from other machines on the LAN.
      # Set POSTGRES_PORT (and DATABASE_URL) if 5432 is taken by a locally installed PostgreSQL.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18 keeps its data under a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasfa -d wasfa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # AOF so queued jobs survive a restart, like production.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      # Set REDIS_PORT (and REDIS_URL) if 6379 is taken by a locally installed Redis.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store for uploaded prescription images (R2 in production, same code).
  # Pinned by digest: MinIO no longer publishes to Docker Hub, so this is Chainguard's build.
  # The image has no shell, hence no curl healthcheck; `minio-init` retries until the server is up.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2915cb406f38ed6ff9634de0a3e4a9423e2dda06a6f1aca18f8c968aa37a01f6
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: wasfa
      MINIO_ROOT_PASSWORD: wasfa_dev_password
    ports:
      # Set MINIO_PORT (and R2_UPLOADS_ENDPOINT) if 9000 is taken. Console: http://127.0.0.1:9001
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # Creates the private bucket once and exits. `MC_HOST_<alias>` configures mc without a shell.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:7d0cf8f3de478cd4d2a8df4efcff9563091e298c8916122bbbbedb2ce08edcad
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://wasfa:wasfa_dev_password@minio:9000
    command: ["mb", "--ignore-existing", "local/wasfa-uploads"]

  # The PUBLIC media bucket (Phase 4 WP2): only the `media/` prefix is world-readable (published
  # variants); `staging/` (unvalidated uploads) stays private. The image has no shell, so the
  # bucket and its policy are two one-shot services.
  minio-media-init:
    image: cgr.dev/chainguard/minio-client@sha256:7d0cf8f3de478cd4d2a8df4efcff9563091e298c8916122bbbbedb2ce08edcad
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://wasfa:wasfa_dev_password@minio:9000
    command: ["mb", "--ignore-existing", "local/wasfa-media"]

  minio-media-policy:
    image: cgr.dev/chainguard/minio-client@sha256:7d0cf8f3de478cd4d2a8df4efcff9563091e298c8916122bbbbedb2ce08edcad
    depends_on:
      minio-media-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      MC_HOST_local: http://wasfa:wasfa_dev_password@minio:9000
    command: ["anonymous", "set", "download", "local/wasfa-media/media"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
