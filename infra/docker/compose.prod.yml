# Production stack: Caddy -> web / api -> worker, Postgres, Redis.
#
#   docker compose --env-file .env.prod -f compose.prod.yml up -d
#
# `.env.prod` lives only on the server (chmod 600, never committed); `.env.example` lists every
# variable. Images are pulled from GHCR; to build them locally add `-f compose.build.yml`.
#
# Sizing: written for a 2 vCPU / 4 GB host (AWS t3.medium). Limits add up to ~2.7 GB of the 4 GB,
# leaving room for the OS, Docker and page cache. To resize, scale `mem_limit` together with the
# matching Postgres/Redis settings (see postgres/postgresql.conf and redis/redis.conf).
name: wasfa

x-base: &base
  restart: unless-stopped
  # Drop every Linux capability; services that really need one add it back explicitly.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Application containers hold no state: read-only root filesystem, scratch space in RAM.
x-app: &app
  <<: *base
  read_only: true
  tmpfs:
    - /tmp

services:
  caddy:
    <<: *base
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    read_only: true
    tmpfs:
      - /tmp
    # NET_BIND_SERVICE: ports 80/443. DAC_READ_SEARCH: read the 600 certificate key owned by `deploy`
    # (Caddy runs as root inside the container but with every other capability dropped).
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]
    ports:
      # Overridable only so the stack can run next to other software on a developer machine.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-wasfa.online}
      API_DOMAIN: ${API_DOMAIN:-api.wasfa.online}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Production by default; local runs set CADDY_TLS_FILE=./caddy/tls.local.caddy.
      - ${CADDY_TLS_FILE:-./caddy/tls.prod.caddy}:/etc/caddy/tls.caddy:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.30.0.2
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2020/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5

  web:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/wasfa-web:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      # Extra CSP sources (space separated), e.g. Turnstile: https://challenges.cloudflare.com
      CSP_SCRIPT_SRC_EXTRA: ${CSP_SCRIPT_SRC_EXTRA:-}
      CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
      CSP_FRAME_SRC_EXTRA: ${CSP_FRAME_SRC_EXTRA:-}
      CSP_IMG_SRC_EXTRA: ${CSP_IMG_SRC_EXTRA:-}
    tmpfs:
      - /tmp
      # Next.js writes its runtime cache here.
      - /app/apps/web/.next/cache
    networks: [edge]
    mem_limit: 512m
    cpus: 1.0

  api:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/wasfa-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-https://wasfa.online}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      # Authentication (Better Auth). The api container reaches Cloudflare (Turnstile), Google and
      # the breached-password service through the `edge` network.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      API_PUBLIC_URL: https://${API_DOMAIN:-api.wasfa.online}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.wasfa.online}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-19456}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      # Caddy fixed address on the edge network: the only peer allowed to set CF-Connecting-IP.
      TRUST_PROXY: 172.30.0.2
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # `edge` so Caddy can reach it (and it can call AI/payment providers); `internal` for the data stores.
    networks: [edge, internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

  worker:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/wasfa-worker:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY_SYSTEM: ${WORKER_CONCURRENCY_SYSTEM:-1}
    # Internal only: no route to the internet. When a job needs one (email, AI, R2), add the
    # `egress` network here together with that job.
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy
    # Active jobs get 30 s to finish (WORKER_SHUTDOWN_TIMEOUT_MS); Docker must wait longer than that.
    stop_grace_period: 40s
    mem_limit: 256m
    cpus: 0.5

  postgres:
    <<: *base
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    # The entrypoint starts as root to fix volume ownership, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 128mb
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.5

  redis:
    <<: *base
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # `requirepass` is injected from REDIS_PASSWORD through the `redis_auth` config below, so it
    # never lands in a committed file and never appears on the command line.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    configs:
      - source: redis_auth
        target: /run/redis-auth/auth.conf
        mode: 0444
    cap_add: [CHOWN, SETGID, SETUID]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5

  # One-off: `docker compose --env-file .env.prod -f compose.prod.yml run --rm migrate`.
  # Reuses the API image, which contains @wasfa/db and its SQL migrations (tsx is a dev dependency
  # and is not in production images, hence the compiled `dist/migrate.js`).
  migrate:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/wasfa-api:${IMAGE_TAG:-latest}
    profiles: [tools]
    restart: "no"
    command: ["node", "node_modules/@wasfa/db/dist/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

  # Nightly encrypted dump -> Cloudflare R2, started by the host's wasfa-backup.timer (see
  # provision.sh). Also the restore tool:
  #   docker compose --env-file .env.prod -f compose.prod.yml run --rm \
  #     -v /path/to/age-key.txt:/run/age-identity:ro backup restore.sh --verify latest
  # Kept out of the worker on purpose: it needs pg_dump 18 and the internet, and must keep
  # working (and alerting) when the worker or API are broken. Only the PUBLIC age key lives here.
  backup:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/wasfa-backup:${IMAGE_TAG:-latest}
    profiles: [tools]
    restart: "no"
    command: ["backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      # Optional here so a missing value never blocks a deploy; backup.sh refuses to run without them.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PROVIDER: ${R2_PROVIDER:-Cloudflare}
      R2_BUCKET: ${R2_BUCKET:-wasfa-backups}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_ALERT_TELEGRAM_BOT_TOKEN: ${BACKUP_ALERT_TELEGRAM_BOT_TOKEN:-}
      BACKUP_ALERT_TELEGRAM_CHAT_ID: ${BACKUP_ALERT_TELEGRAM_CHAT_ID:-}
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
    # `internal` reaches Postgres, `egress` reaches R2. Nothing is published.
    networks: [internal, egress]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

networks:
  # Caddy <-> web/api. Caddy gets a fixed address (TRUST_PROXY above); everything else is handed
  # addresses from the upper half only, so a container that starts first can never take Caddy's.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
  # api/worker/postgres/redis. `internal: true` = no route to the internet and nothing published.
  internal:
    driver: bridge
    internal: true
  # Outbound-only network for tools that must reach the internet but expose nothing (backup job).
  egress:
    driver: bridge

configs:
  redis_auth:
    content: |
      requirepass ${REDIS_PASSWORD:?}

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
