# Build the images from source (CI and local testing); layered on top of compose.prod.yml:
#   docker compose --env-file .env.prod -f compose.prod.yml -f compose.build.yml build
# The build context is the repository root.
services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://wasfa.online}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.wasfa.online}
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
  backup:
    build:
      context: ../..
      dockerfile: infra/docker/backup.Dockerfile
