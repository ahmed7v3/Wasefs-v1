<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Wasfa AI — logo directions</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f6f6f4;
        color: #0f172a;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 16px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      section {
        margin-block-end: 28px;
        padding: 16px;
        border: 1px solid #d4d4d8;
        border-radius: 12px;
        background: #fff;
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: 24px;
        flex-wrap: wrap;
        margin-block-end: 16px;
      }
      .panel {
        padding: 16px;
        border-radius: 10px;
        display: flex;
        align-items: flex-end;
        gap: 24px;
        flex-wrap: wrap;
      }
      .light {
        background: #fff;
        border: 1px solid #e4e4e7;
      }
      .dark {
        background: #0f172a;
      }
      figure {
        margin: 0;
        text-align: center;
        font-size: 11px;
        color: #71717a;
      }
      .dark figure {
        color: #94a3b8;
      }
      img {
        display: block;
        margin-inline: auto;
        margin-block-end: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Logo directions: A (waw-check, default), B (sheet-scan), C (wordmark)</h1>

    <section>
      <h2>A. و-check tile</h2>
      <div class="row">
        <div class="panel light">
          <figure><img src="a-waw-check.svg" width="16" height="16" alt="" />16</figure>
          <figure><img src="a-waw-check.svg" width="32" height="32" alt="" />32</figure>
          <figure><img src="a-waw-check.svg" width="64" height="64" alt="" />64</figure>
          <figure><img src="a-waw-check.svg" width="180" height="180" alt="" />180</figure>
        </div>
        <div class="panel dark">
          <figure><img src="a-waw-check.svg" width="16" height="16" alt="" />16</figure>
          <figure><img src="a-waw-check.svg" width="32" height="32" alt="" />32</figure>
          <figure><img src="a-waw-check.svg" width="64" height="64" alt="" />64</figure>
        </div>
      </div>
      <div class="row">
        <div class="panel light"><img src="a-waw-check-lockup.svg" height="56" alt="" /></div>
        <div class="panel dark"><img src="a-waw-check-lockup-dark.svg" height="56" alt="" /></div>
      </div>
    </section>

    <section>
      <h2>B. Prescription sheet + scan line</h2>
      <div class="row">
        <div class="panel light">
          <figure><img src="b-sheet-scan.svg" width="16" height="16" alt="" />16</figure>
          <figure><img src="b-sheet-scan.svg" width="32" height="32" alt="" />32</figure>
          <figure><img src="b-sheet-scan.svg" width="64" height="64" alt="" />64</figure>
          <figure><img src="b-sheet-scan.svg" width="180" height="180" alt="" />180</figure>
        </div>
        <div class="panel dark">
          <figure><img src="b-sheet-scan.svg" width="16" height="16" alt="" />16</figure>
          <figure><img src="b-sheet-scan.svg" width="32" height="32" alt="" />32</figure>
          <figure><img src="b-sheet-scan.svg" width="64" height="64" alt="" />64</figure>
        </div>
      </div>
      <div class="row">
        <div class="panel light"><img src="b-sheet-scan-lockup.svg" height="56" alt="" /></div>
        <div class="panel dark"><img src="b-sheet-scan-lockup-dark.svg" height="56" alt="" /></div>
      </div>
    </section>

    <section>
      <h2>C. Wordmark only (dots of the ة become a check badge)</h2>
      <div class="row">
        <div class="panel light">
          <figure><img src="c-wordmark.svg" height="16" alt="" />16</figure>
          <figure><img src="c-wordmark.svg" height="32" alt="" />32</figure>
          <figure><img src="c-wordmark.svg" height="64" alt="" />64</figure>
          <figure><img src="c-wordmark.svg" height="180" alt="" />180</figure>
        </div>
        <div class="panel dark">
          <figure><img src="c-wordmark-dark.svg" height="16" alt="" />16</figure>
          <figure><img src="c-wordmark-dark.svg" height="32" alt="" />32</figure>
          <figure><img src="c-wordmark-dark.svg" height="64" alt="" />64</figure>
        </div>
      </div>
      <p>Direction C has no standalone symbol: a favicon would need a separate square monogram.</p>
    </section>
  </body>
</html>
