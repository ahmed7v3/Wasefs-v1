# gitleaks configuration (CI job `security`, and `gitleaks detect` locally).
# Start from the maintained default rule set and only add narrow, explained exceptions.
title = "wasfa"

[extend]
useDefault = true

[allowlist]
description = "Values that look like secrets but are not"
paths = [
  # Lockfile integrity hashes look like high-entropy tokens.
  '''(^|/)pnpm-lock\.yaml$''',
  # Obviously fake provider keys used as fixtures by the admin AI integration tests: they prove
  # that a key never appears in a response or an audit row, so they must look like real keys.
  '''(^|/)apps/api/test/admin-ai(-ops)?\.int\.test\.ts$''',
]
regexes = [
  # Throwaway password of the local development database in compose.dev.yml / .env.example.
  # It protects a container bound to 127.0.0.1 and is never used outside a developer machine.
  '''wasfa_dev_password''',
  # Fake verification token in the worker email tests (apps/worker/test/email.int.test.ts); the
  # test proves this exact string never reaches Redis or the logs, so it must look like a token.
  '''tok_9f8e7d6c5b4a39281706''',
  # Fake IndexNow key of the worker sender tests in commit 959edbe (since replaced by a
  # low-entropy value); IndexNow keys are public by protocol anyway (served at /indexnow.txt).
  '''abcdef0123456789''',
  # Fake ElevenLabs keys of the WhatsApp agent voice/admin tests: the tests prove the key is
  # never returned, logged or audited, so it must look like a key.
  '''xi-(secret|test)-key-0123456789-?abcdef(ghij)?''',
  # Fake R2 object key of the WhatsApp agent outbound-part tests (not a credential).
  '''wa/2026/10/abcdefgh''',
]
