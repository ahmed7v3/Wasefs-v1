version: 2

# Weekly update PRs. CI (tests, audit, image scan) runs on each of them before it can merge.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR for routine minor/patch bumps; majors stay separate so they get reviewed on their own.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Base images pinned by digest in the Dockerfiles.
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday

  # Postgres, Redis and Caddy images (pinned by digest) in the compose files.
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
