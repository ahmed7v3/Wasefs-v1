name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: deploy.yml waits for it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  # Lint, types, tests and a full build. Required status check.
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # Integration tests start Postgres 18 and Redis 8 with Testcontainers (Docker is preinstalled
      # on the runner). Each suite gets its own containers, so suites that run in parallel cannot
      # see each other's data or Redis keys, which shared `services:` containers could not guarantee.
      - run: pnpm test

      - run: pnpm build

  # Secret scan and dependency audit. Required status check.
  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still a leaked secret.
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" detect \
              --source /repo --config /repo/.gitleaks.toml \
              --redact --no-banner --verbose

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Accepted advisories live in pnpm-workspace.yaml (`auditConfig`), each with a reason.
      - run: pnpm audit --audit-level high

  # Build, scan and publish the three images. Only on main, only after both checks above passed.
  images:
    name: Image ${{ matrix.image }}
    needs: [verify, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, api, worker, backup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        # GHCR repository names must be lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wasfa-${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) Build into the local Docker daemon only. Nothing is published yet.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # NEXT_PUBLIC_* are baked into the web bundle; the other Dockerfiles ignore build args.
          build-args: |
            NEXT_PUBLIC_ENV=production
            NEXT_PUBLIC_SITE_URL=https://wasfa.online
            NEXT_PUBLIC_API_URL=https://api.wasfa.online
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}

      # 2) Scan before publishing: a HIGH/CRITICAL finding that has a fix blocks the push, so a
      #    vulnerable image never gets the `latest` tag or reaches the server.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Dated, justified exceptions only (see the file): they expire and re-open the finding.
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table

      # 3) Publish. Same inputs, so everything comes from the build cache.
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          build-args: |
            NEXT_PUBLIC_ENV=production
            NEXT_PUBLIC_SITE_URL=https://wasfa.online
            NEXT_PUBLIC_API_URL=https://api.wasfa.online
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}

  # Browser tests of Phase 1's web flows against the real stack (API, worker, web, Postgres 18,
  # Redis 8 started by Testcontainers), with axe accessibility checks at 360 px and 1440 px and a
  # Turnstile/CSP check using Cloudflare's public test keys (needs internet, which the runner has).
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suite runs the built API and worker. The web app is built by the suite itself (its
      # NEXT_PUBLIC_* values are baked in at build time), so the default web build is skipped here.
      - name: Build API and worker
        run: pnpm turbo run build --filter=@wasfa/api --filter=@wasfa/worker

      - name: Install Chromium
        run: pnpm --filter @wasfa/web exec playwright install --with-deps chromium

      - name: Run the suite
        run: pnpm --filter @wasfa/web e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/.logs
          retention-days: 7

  # Lighthouse on the public home page (Task 1.11): mobile Performance >= 95, SEO 100, Best
  # Practices 100, Accessibility >= 95. Runs the production build against no API at all: public
  # pages fall back to the default settings when it is unreachable.
  lighthouse:
    name: Lighthouse (home page)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Non-blocking while the Phase 4 baseline is recorded (/, /pricing, /en, stricter budgets):
    # switch to blocking once it is.
    continue-on-error: true
    env:
      # This build is a throwaway local server. `production` is what makes the page indexable
      # (any other value is noindex, which would fail the SEO audit by design); nothing is deployed.
      NEXT_PUBLIC_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3300
      # Nothing listens here: the server-side settings fetch fails fast and uses its defaults.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same command as the web Dockerfile; not through turbo, whose cache ignores these env values.
      - run: pnpm --filter "@wasfa/web..." run build

      # Not a dependency of the repo: its transitive packages fail `pnpm audit`, and it only runs here.
      # The runner's Google Chrome is used.
      - name: Lighthouse CI
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
