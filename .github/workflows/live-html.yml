name: Live HTML check

# Guards the live site against Cloudflare rewrites (email obfuscation, injected scripts without a
# nonce) and missing security headers. Daily, by hand, and callable from other workflows.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check live HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: node scripts/check-live-html.mjs https://wasfa.online
